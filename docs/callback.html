<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Threads OAuth Callback</title>
</head>
<body style="font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px;">
  <h3>Threads 인증 코드</h3>
  <p>아래 값을 복사해서 <code>scripts/oauth_setup.py</code> 실행 중 프롬프트에 붙여넣으세요.</p>
  <textarea id="code" readonly style="width:100%; height:120px; font-size:13px;"></textarea>
  <p id="empty" style="color: #b00; display:none;">
    code 파라미터가 없습니다. 인증이 실패했거나, 이 페이지에 직접 접속하신 경우입니다.
  </p>
  <script>
    const params = new URLSearchParams(window.location.search);
    let code = params.get("code");
    if (code) {
      code = code.replace(/#_$/, "");
      document.getElementById("code").value = code;
    } else {
      document.getElementById("empty").style.display = "block";
    }
  </script>
</body>
</html>
