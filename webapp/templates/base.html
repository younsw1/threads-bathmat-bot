<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}듀오포스트{% endblock %}</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <div class="brand-text">
        <strong>듀오포스트</strong>
        <span>Threads·Instagram 자동 발행</span>
      </div>
    </div>
    <nav>
      <a href="{{ url_for('home') }}" class="{{ 'active' if request.path == url_for('home') }}">홈</a>
      <a href="{{ url_for('products') }}" class="{{ 'active' if request.path == url_for('products') }}">상품 목록</a>
      <a href="{{ url_for('published_products') }}" class="{{ 'active' if request.path == url_for('published_products') }}">발행된 상품</a>
      <a href="{{ url_for('queue_list') }}" class="{{ 'active' if request.path == url_for('queue_list') }}">예약 대기열</a>
      <a href="{{ url_for('new_product') }}" class="{{ 'active' if request.path == url_for('new_product') }}">상품 추가</a>
      <a href="{{ url_for('setup') }}" class="{{ 'active' if request.path == url_for('setup') }}">설정</a>
      <a href="{{ url_for('manual') }}" class="{{ 'active' if request.path == url_for('manual') }}">사용설명서</a>
    </nav>
    <div class="sidebar-footer">
      <span class="status-dot"></span> 로컬 실행 중
    </div>
  </aside>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</div>
<script>
(function () {
  document.querySelectorAll(".img-order-picker").forEach(function (picker) {
    var max = parseInt(picker.dataset.max || "3", 10);
    var fieldName = picker.dataset.fieldName || "image_url";
    var order;
    try { order = JSON.parse(picker.dataset.initial || "[]"); } catch (e) { order = []; }
    order = order.slice(0, max);
    var items = picker.querySelectorAll(".img-order-item");
    var hiddenBox = document.querySelector('.img-order-hidden[data-for="' + picker.id + '"]');
    var countEl = document.querySelector('.img-order-count[data-for="' + picker.id + '"]');

    function render() {
      items.forEach(function (item) {
        var url = item.dataset.url;
        var idx = order.indexOf(url);
        var badge = item.querySelector(".img-order-badge");
        var img = item.querySelector("img:not(.img-zoom-preview)");
        if (idx >= 0) {
          badge.textContent = idx + 1;
          badge.classList.add("visible");
          img.classList.add("selected");
        } else {
          badge.textContent = "";
          badge.classList.remove("visible");
          img.classList.remove("selected");
        }
      });
      if (hiddenBox) {
        hiddenBox.innerHTML = "";
        order.forEach(function (url) {
          var input = document.createElement("input");
          input.type = "hidden";
          input.name = fieldName;
          input.value = url;
          hiddenBox.appendChild(input);
        });
      }
      if (countEl) countEl.textContent = order.length;
    }

    items.forEach(function (item) {
      item.addEventListener("click", function () {
        var url = item.dataset.url;
        var idx = order.indexOf(url);
        if (idx >= 0) {
          order.splice(idx, 1);
        } else if (order.length < max) {
          order.push(url);
        } else {
          alert("이미지는 최대 " + max + "장까지 선택할 수 있습니다. 먼저 선택 해제한 뒤 다시 골라주세요.");
          return;
        }
        render();
      });
    });

    render();
  });
})();
</script>
</body>
</html>
